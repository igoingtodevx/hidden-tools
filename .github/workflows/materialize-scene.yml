name: Materialize scene asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-scene.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode verified WebP
        run: |
          mkdir -p assets
          base64 --decode assets/infinity.b64 > assets/scene.webp
          file assets/scene.webp
          test "$(head -c 4 assets/scene.webp)" = "RIFF"
      - name: Commit binary asset and direct loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          p.write_text('''<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Hidden Labs</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040b}img{position:fixed;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none}</style>
</head>
<body><img src="/assets/scene.webp?v=1" alt="Cosmic infinity scene"></body>
</html>''')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/scene.webp index.html
          git commit -m "Deploy verified scene binary" || exit 0
          git push
