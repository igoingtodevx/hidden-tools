<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02040b">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Hidden Labs</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040b}
    body{min-height:100dvh}
    #scene{position:fixed;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center;opacity:0;transition:opacity .18s linear;user-select:none;-webkit-user-drag:none}
    body.ready #scene{opacity:1}
    #error{display:none;position:fixed;inset:0;place-items:center;padding:24px;color:#fff;background:#02040b;font:14px/1.5 system-ui,sans-serif;text-align:center}
    body.failed #error{display:grid}
    @media(prefers-reduced-motion:reduce){#scene{transition:none}}
  </style>
</head>
<body>
  <img id="scene" alt="Cosmic infinity scene with a solitary white-haired figure">
  <div id="error">The scene asset could not be loaded.</div>
  <script>
    const image=document.getElementById('scene');
    fetch('./assets/infinity.b64?v=3',{cache:'no-store'})
      .then(response=>{
        if(!response.ok) throw new Error('Asset request failed: '+response.status);
        return response.text();
      })
      .then(base64=>{
        const clean=base64.replace(/\s+/g,'');
        if(!clean.startsWith('UklG')) throw new Error('Asset content is invalid');
        image.onload=()=>document.body.classList.add('ready');
        image.onerror=()=>document.body.classList.add('failed');
        image.src='data:image/webp;base64,'+clean;
      })
      .catch(error=>{
        console.error(error);
        document.getElementById('error').textContent=error.message;
        document.body.classList.add('failed');
      });
  </script>
</body>
</html>
