<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Hidden Tools</title><style>html,body{margin:0;min-height:100%;background:#0c0c18}</style></head><body><script>(async()=>{try{let s="";for(let i=0;i<3;i++){const u=`./assets/live/layout-${String(i).padStart(2,"0")}.txt`;const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(`${u}: ${r.status}`);s+=await r.text()}document.open();document.write(s);document.close()}catch(e){document.body.textContent="LOAD FAILED: "+e.message;document.body.style.cssText="color:white;background:#900;font:16px monospace;padding:20px";console.error(e)}})();</script></body></html>
