<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02040b">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Hidden Labs</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040b}body{min-height:100dvh}.scene{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#02040b}.scene img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}.backdrop{object-fit:cover;filter:blur(34px) saturate(1.08) brightness(.42);transform:scale(1.08);opacity:0;transition:opacity .7s ease;z-index:-1}.image{object-fit:cover;object-position:50% 50%;opacity:0;transform:scale(1.012);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1.1s cubic-bezier(.2,.8,.2,1)}.loaded .backdrop,.loaded .image{opacity:1}.loaded .image{transform:scale(1)}.scene:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 22px rgba(0,0,0,.28)}@media(max-aspect-ratio:3/4){.image{object-position:50% 50%}}@media(prefers-reduced-motion:reduce){.backdrop,.image{transition:none}}
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Cosmic infinity scene">
    <img class="backdrop" id="backdrop" alt="" aria-hidden="true">
    <img class="image" id="image" alt="A solitary white-haired figure standing on a reflective cosmic landscape beneath a vast dark vortex.">
  </main>
  <script>
    fetch('./assets/infinity.b64')
      .then(response => {
        if (!response.ok) throw new Error('Scene asset could not be loaded');
        return response.text();
      })
      .then(base64 => {
        const source = 'data:image/webp;base64,' + base64.trim();
        document.getElementById('backdrop').src = source;
        const image = document.getElementById('image');
        image.onload = () => document.getElementById('scene').classList.add('loaded');
        image.src = source;
      })
      .catch(() => document.body.style.background = '#02040b');
  </script>
</body>
</html>
