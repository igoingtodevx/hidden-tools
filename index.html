<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02040b">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Hidden Labs</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040b}
    body{min-height:100dvh}
    .scene{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#02040b}
    .scene img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
    .backdrop{object-fit:cover;filter:blur(34px) saturate(1.08) brightness(.42);transform:scale(1.08);opacity:0;transition:opacity .7s ease;z-index:-1}
    .image{object-fit:cover;object-position:50% 50%;opacity:0;transform:scale(1.012);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1.1s cubic-bezier(.2,.8,.2,1)}
    .loaded .backdrop,.loaded .image{opacity:1}
    .loaded .image{transform:scale(1)}
    .scene:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 22px rgba(0,0,0,.28)}
    .error{position:fixed;left:16px;bottom:16px;padding:8px 10px;background:#220b13;color:#ffb7cc;font:12px/1.4 system-ui;border:1px solid #71304a;border-radius:8px}
    @media(prefers-reduced-motion:reduce){.backdrop,.image{transition:none}}
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Cosmic infinity scene">
    <img class="backdrop" id="backdrop" alt="" aria-hidden="true">
    <img class="image" id="image" alt="A solitary white-haired figure standing on a reflective cosmic landscape beneath a vast dark vortex.">
  </main>
  <script>
    const chunks = [0,1,2].map(i => `./assets/scene-chunks/${i}.txt?v=2`);
    Promise.all(chunks.map(url => fetch(url, {cache:'no-store'}).then(r => {
      if (!r.ok) throw new Error(`${url}: ${r.status}`);
      return r.text();
    })))
      .then(parts => {
        const source = 'data:image/webp;base64,' + parts.join('').replace(/\s+/g, '');
        const scene = document.getElementById('scene');
        const backdrop = document.getElementById('backdrop');
        const image = document.getElementById('image');
        image.onload = () => scene.classList.add('loaded');
        image.onerror = () => { throw new Error('Decoded scene image is invalid'); };
        backdrop.src = source;
        image.src = source;
      })
      .catch(error => {
        console.error(error);
        const badge = document.createElement('div');
        badge.className = 'error';
        badge.textContent = 'Scene failed to load: ' + error.message;
        document.body.appendChild(badge);
      });
  </script>
</body>
</html>
